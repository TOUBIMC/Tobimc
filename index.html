<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="TOUBIMC Minecraft community landing page">
  <title>TOUBIMC</title>

  <style>
    :root{
      --black:#060606;
      --black-2:#0c0c0c;
      --panel:#111010;
      --panel-2:#171414;
      --red:#ed2632;
      --red-2:#ff4a55;
      --red-dark:#671016;
      --text:#f5eeee;
      --muted:#8f8585;
      --line:rgba(237,38,50,.28);
      --font: "Courier New", "Lucida Console", monospace;
    }

    *{box-sizing:border-box}
    html{min-height:100%;background:var(--black)}
    body{
      margin:0;
      min-height:100vh;
      overflow-x:hidden;
      color:var(--text);
      font-family:var(--font);
      background:
        radial-gradient(circle at 50% 8%,rgba(237,38,50,.17),transparent 34%),
        linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),
        var(--black);
      background-size:auto,32px 32px,32px 32px,auto;
    }

    body::before,
    body::after{
      content:"";
      position:fixed;
      z-index:-1;
      width:230px;
      height:230px;
      opacity:.22;
      pointer-events:none;
      background:
        linear-gradient(90deg,transparent 47%,rgba(237,38,50,.25) 48% 52%,transparent 53%),
        linear-gradient(transparent 47%,rgba(237,38,50,.25) 48% 52%,transparent 53%);
      background-size:28px 28px;
      mask-image:linear-gradient(135deg,#000,transparent 72%);
    }
    body::before{left:-90px;top:8%}
    body::after{right:-100px;bottom:5%;transform:rotate(180deg)}

    .page{
      width:min(1080px,calc(100% - 40px));
      min-height:calc(100vh - 62px);
      margin:auto;
      padding:64px 0 46px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .hero{text-align:center}

    h1{
      margin:0;
      font-size:clamp(4rem,13vw,9rem);
      line-height:.86;
      letter-spacing:-.075em;
      font-weight:1000;
      color:var(--red-2);
      text-shadow:
        4px 4px 0 #30080c,
        8px 8px 0 rgba(0,0,0,.82),
        0 0 20px rgba(237,38,50,.7),
        0 0 60px rgba(237,38,50,.2);
      -webkit-text-stroke:1px #ff777e;
    }

    .rule{
      width:116px;
      height:5px;
      margin:25px auto 0;
      background:var(--red);
      box-shadow:0 0 20px rgba(237,38,50,.7);
      clip-path:polygon(0 0,100% 0,100% 65%,88% 65%,88% 100%,0 100%);
    }

    .links{
      width:min(900px,100%);
      margin-top:58px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:24px;
    }

    .card{
      position:relative;
      min-height:126px;
      padding:24px 28px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      color:var(--text);
      text-decoration:none;
      background:
        linear-gradient(135deg,rgba(237,38,50,.12),transparent 55%),
        linear-gradient(180deg,var(--panel-2),var(--panel));
      border:1px solid var(--line);
      outline:1px solid rgba(0,0,0,.85);
      outline-offset:-6px;
      box-shadow:0 15px 36px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.045);
      clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
      transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease,background .22s ease;
      -webkit-tap-highlight-color:transparent;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:0 auto 0 0;
      width:4px;
      background:var(--red);
      box-shadow:0 0 20px rgba(237,38,50,.7);
      transition:width .22s ease;
    }

    .card::after{
      content:"";
      position:absolute;
      width:86px;
      height:86px;
      right:-35px;
      bottom:-45px;
      border:1px solid rgba(237,38,50,.18);
      transform:rotate(45deg);
      pointer-events:none;
    }

    .card:hover,
    .card:focus-visible{
      transform:translateY(-6px);
      border-color:rgba(255,74,85,.8);
      box-shadow:0 20px 44px rgba(0,0,0,.5),0 0 30px rgba(237,38,50,.15);
      background:
        linear-gradient(135deg,rgba(237,38,50,.2),transparent 60%),
        #171111;
    }

    .card:hover::before,
    .card:focus-visible::before{width:7px}

    .card:focus-visible{
      outline:2px solid #ff777e;
      outline-offset:5px;
    }

    .donate{margin-top:58px}
    .rubika{
      grid-column:1 / 3;
      width:min(62%,520px);
      justify-self:center;
      margin-top:2px;
    }

    .copy{
      position:relative;
      z-index:1;
      display:flex;
      flex-direction:column;
      gap:9px;
    }

    .title{
      font-size:clamp(14px,2vw,19px);
      font-weight:900;
      letter-spacing:.035em;
    }

    .icon{
      position:relative;
      z-index:1;
      width:36px;
      height:36px;
      flex:0 0 36px;
      display:grid;
      place-items:center;
      color:var(--red-2);
      border:1px solid rgba(237,38,50,.42);
      background:rgba(237,38,50,.08);
      transition:transform .2s ease,background .2s ease;
    }

    .card:hover .icon{transform:translate(2px,-2px);background:rgba(237,38,50,.2)}
    .icon svg{width:15px;height:15px}

    footer{
      min-height:62px;
      padding:20px 16px 24px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#5e5555;
      font-size:9px;
      letter-spacing:.2em;
      text-align:center;
    }
    footer span{color:#984047}

    .community-note{width:min(760px,100%);margin:42px auto 0;padding:22px 24px 24px;text-align:center;direction:rtl;background:linear-gradient(180deg,rgba(237,38,50,.07),rgba(255,255,255,.015));border:1px solid rgba(237,38,50,.18);box-shadow:0 12px 30px rgba(0,0,0,.25);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
    .community-text{margin:0;color:#e9dede;font-family:"Courier New","Lucida Console",monospace;font-size:13px;font-weight:700;line-height:1.9;letter-spacing:.02em}
    .friends-title{margin:17px 0 13px;color:#a74a50;font-family:"Courier New","Lucida Console",monospace;font-size:10px;font-weight:900;letter-spacing:.14em}
    .friend-links{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;direction:rtl}
    .friend-link{min-width:150px;padding:12px 16px;color:#f5eeee;text-decoration:none;font-family:"Courier New","Lucida Console",monospace;font-size:10px;font-weight:900;letter-spacing:.05em;background:#111010;border:1px solid rgba(237,38,50,.3);box-shadow:inset 0 1px rgba(255,255,255,.04);transition:transform .2s ease,border-color .2s ease,background .2s ease}
    .friend-link:hover,.friend-link:focus-visible{transform:translateY(-3px);border-color:rgba(255,74,85,.75);background:#191111;outline:none}
    .friend-link .emoji{margin-left:6px;font-family:system-ui,sans-serif}
    @media(max-width:700px){.community-note{margin-top:34px;padding:19px 16px 20px}.community-text{font-size:11px}.friend-link{width:100%;min-width:0}}

    @media(max-width:700px){
      .page{
        width:min(100% - 32px,460px);
        padding-top:56px;
      }

      .links{
        display:flex;
        flex-direction:column;
        gap:16px;
        margin-top:48px;
      }

      .card,
      .donate,
      .rubika{
        width:100%;
        min-height:104px;
        margin:0;
      }

      .card{padding:22px 23px}
      .title{font-size:14px}
    }

    @media(prefers-reduced-motion:reduce){
      .card,.icon{transition:none}
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="hero">
      <h1>TOUBIMC</h1>
    </header>

    <nav class="links" aria-label="TOUBIMC links">
      <a class="card aparat" id="aparat-link" href="#" target="_blank" rel="noopener noreferrer">
        <span class="copy"><span class="title">APARAT CHANNEL</span></span>
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
            <path d="M14 4h6v6M20 4l-9 9"></path>
            <path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"></path>
          </svg>
        </span>
      </a>

      <a class="card donate" id="donate-link" href="#" target="_blank" rel="noopener noreferrer">
        <span class="copy"><span class="title">DONATE</span></span>
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
            <path d="M14 4h6v6M20 4l-9 9"></path>
            <path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"></path>
          </svg>
        </span>
      </a>

      <a class="card rubika" id="rubika-link" href="#" target="_blank" rel="noopener noreferrer">
        <span class="copy"><span class="title">RUBIKA CHANNEL</span></span>
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
            <path d="M14 4h6v6M20 4l-9 9"></path>
            <path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"></path>
          </svg>
        </span>
      </a>
    </nav>
    <section class="community-note" aria-label="Community and friends">
      <p class="community-text">اگه عاشق فعالیت ماینکرافتی هستی کانال توبی رو دنبال کن</p>
      <p class="friends-title">همکار ها و رفیقام 🍇🫐</p>
      <div class="friend-links">
        <a class="friend-link" href="https://rubika.ir/Info_ar_gamer" target="_blank" rel="noopener noreferrer"><span class="emoji">🍇</span> کانال ای ار</a>
        <a class="friend-link" href="https://runika.ir/InFo_TAmeshk1" target="_blank" rel="noopener noreferrer"><span class="emoji">🫐</span> کانال تمشک</a>
      </div>
    </section>

  </main>

  <footer>Coded By <span>MaMaLi</span></footer>

  <script>
    // ============================================================
    // REPLACE ONLY THESE THREE VALUES WITH YOUR REAL URLs.
    // ============================================================
    const APARAT_LINK = "https://www.aparat.com/toubi/short-videos";
    const DONATE_LINK = "http://Daramet.com/toubimc";
    const RUBIKA_LINK = "https://rubika.ir/info_toubimc";

    const links = [
      ["aparat-link", APARAT_LINK],
      ["donate-link", DONATE_LINK],
      ["rubika-link", RUBIKA_LINK]
    ];

    links.forEach(([id, url]) => {
      const element = document.getElementById(id);

      if (url && !url.startsWith("PASTE_")) {
        element.href = url;
      } else {
        element.addEventListener("click", event => event.preventDefault());
      }
    });
  </script>
</body>
</html>
